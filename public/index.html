<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Claude Code Hub</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg"><link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="sidebar">
    <h1>Projects</h1>
    <ul id="project-list"></ul>
  </div>
  <div id="sidebar-resizer" title="Drag to resize"></div>

  <div id="main">
    <div id="empty-state">Pick a project on the left to get started.</div>

    <div id="project-view" hidden>
      <div id="tabs">
        <button class="tab-btn active" data-tab="claude">Claude Code</button>
        <button class="tab-btn" data-tab="shell">Terminal</button>
        <button class="tab-btn" data-tab="files">Files</button>
        <span id="current-project"></span>
        <button id="close-sessions-btn" title="Close all tmux sessions for this project" aria-label="Close all tmux sessions for this project">&times;</button>
      </div>

      <div id="tab-claude" class="tab-panel">
        <iframe id="claude-frame" title="Claude Code terminal" hidden></iframe>
        <div id="claude-start-placeholder" class="session-placeholder">
          <button id="claude-start-btn" class="start-session-btn">Click here to start a new session</button>
        </div>
      </div>

      <div id="tab-shell" class="tab-panel" hidden>
        <iframe id="shell-frame" title="Shell terminal" hidden></iframe>
        <div id="shell-start-placeholder" class="session-placeholder">
          <button id="shell-start-btn" class="start-session-btn">Click here to start a new session</button>
        </div>
      </div>

      <div id="tab-files" class="tab-panel" hidden>
        <div id="file-tree-pane">
          <div id="file-tree-header">
            <span>Files</span>
            <div class="file-tree-actions">
              <button id="upload-files-btn" title="Upload files" aria-label="Upload files">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              </button>
              <button id="refresh-files-btn" title="Refresh files" aria-label="Refresh files">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
              </button>
            </div>
          </div>
          <div id="file-tree"></div>
          <div id="file-drop-hint">Drop to upload</div>
          <input id="file-upload-input" type="file" multiple hidden>
        </div>
        <div id="file-editor-wrap">
          <div id="file-toolbar">
            <span id="file-path">Select a file to view or edit</span>
            <div id="md-toggle" class="seg-toggle" hidden>
              <button class="seg-btn active" data-mode="code">Code</button>
              <button class="seg-btn" data-mode="preview">Preview</button>
            </div>
            <button id="wrap-toggle-btn" title="Toggle word wrap" aria-pressed="false">Wrap</button>
            <button id="download-btn" disabled>Download</button>
            <button id="save-btn" disabled>Save</button>
            <span id="save-status"></span>
          </div>
          <div id="editor-host">
            <div id="code-editor"></div>
            <div id="md-preview" hidden></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="vendor/marked.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
