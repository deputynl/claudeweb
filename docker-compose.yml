services:
  claude-web:
    build: .
    container_name: claude-web
    network_mode: lsio
    ports:
      - "8180:8080"
    volumes:
      # Change the left side to your actual dev folder.
      # Each immediate subfolder in here becomes a "project" in the UI.
      - ~/develop:/workspace
      # Bind-mount your host user's actual Claude Code config/credentials
      # instead of a fresh named volume, so the container reuses your
      # already-authenticated session. Linux/WSL host only - see README.
      - ~/.claude:/root/.claude
      - ~/.claude.json:/root/.claude.json
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.claudeweb.entrypoints=web
      - traefik.http.routers.claudeweb.rule=Host(`claudeweb.deputy.nl`)
      - traefik.http.services.claudeweb.loadbalancer.server.port=8080
